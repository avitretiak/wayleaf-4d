[package]
name = "wayleaf-4d"
version = "0.2.0"
edition = "2021"

license = "GPL-3.0-or-later"
rust-version = "1.89"

[lib]
name = "wayleaf_4d"
path = "src/lib.rs"

[[bin]]
name = "wayleaf-4d"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zbus = { version = "5", features = ["blocking"] }
libc = "0.2"
curl = "0.4"
signal-hook = "0.3"
glow = "0.16"
libloading = "0.8"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
